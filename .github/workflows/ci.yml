name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, build e audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck desktop
        run: npm run desktop:typecheck

      - name: Typecheck web
        run: npm run web:typecheck

      - name: Build desktop (Vite)
        run: npm run desktop:build

      - name: Build web
        run: npm run web:build

      - name: Testes (Vitest)
        run: npm test

      - name: Testes E2E (Playwright Electron)
        run: npm run e2e -w desktop
        # E2E no Windows runner pode ser instável no primeiro boot do Electron
        # — mantemos continue-on-error para não bloquear PRs, mas falhas aparecem.
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Audit (falha em vulnerabilidades high/critical)
        run: npm audit --audit-level=high
