name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, build e audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 — mesmo runtime usado em desenvolvimento, onde a suíte
          # inteira passa. No Node 20 do runner o better-sqlite3 (nativo)
          # derrubava os workers do vitest (CI vermelho desde a v1.2.15).
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck desktop
        run: npm run desktop:typecheck

      - name: Typecheck web
        run: npm run web:typecheck

      - name: Build desktop (Vite)
        run: npm run desktop:build

      - name: Build web
        run: npm run web:build

      - name: Testes (Vitest)
        run: npm test

      - name: Testes E2E (Playwright Electron)
        run: npm run e2e -w desktop
        # E2E no Windows runner pode ser instável no primeiro boot do Electron
        # — mantemos continue-on-error para não bloquear PRs, mas falhas aparecem.
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Audit (falha em vulnerabilidades critical)
        # Gate em `critical` — os 2 highs restantes têm contexto conhecido:
        #  - image-size (transitiva, sem correção upstream): parsers de imagem
        #    usados só em tooling de build, não processa imagens de rede.
        #  - pdfjs-dist 5.x: correção exige major 6.x (quebra API do loader);
        #    o app abre PDFs locais escolhidos pelo usuário, não remotos.
        # Quando o upgrade do pdfjs-dist 6 acontecer, voltar para --audit-level=high.
        run: npm audit --audit-level=critical
