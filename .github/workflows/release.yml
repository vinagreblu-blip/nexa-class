name: Release

# Disparado manualmente por tag: bump da versão em desktop/package.json,
# `git tag vX.Y.Z` e `git push --tags`. O CI builda o instalador Windows e
# publica no GitHub Releases (alimenta o auto-update e o botão de download).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # necessário para criar/publicar o Release

jobs:
  release:
    name: Build e publicação Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run desktop:typecheck

      - name: Build desktop (Vite + TS do electron)
        run: npm -w desktop run build

      - name: Empacotar instalador
        # Sem --publish: o upload do electron-builder é flaky para arquivos
        # grandes (~140 MB). O publish é feito no próximo passo via `gh`, que
        # é mais confiável e permite retry/destravar releases incompletos.
        working-directory: desktop
        run: npx electron-builder

      - name: Publicar release (upload robusto)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          # Deleta release anterior caso exista (ex.: re-run com upload incompleto).
          gh release delete "$tag" --repo "$repo" --yes || echo "release anterior nao existia (ok)"
          # Cria release limpo e sobe os 3 assets de uma vez.
          gh release create "$tag" \
            --repo "$repo" \
            --title "${tag#v}" \
            --generate-notes \
            desktop/release/NEXA-CLASS-Setup.exe \
            desktop/release/latest.yml \
            desktop/release/NEXA-CLASS-Setup.exe.blockmap
